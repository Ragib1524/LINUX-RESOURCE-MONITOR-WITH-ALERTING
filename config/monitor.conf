# Linux Resource Monitor - configuration
#
# Format: KEY=VALUE
# Blank lines and lines starting with '#' are ignored.
# Unknown keys are ignored (forward compatibility).

# CPU thresholds (percent, 0..100)
CPU_WARNING=70
CPU_CRITICAL=90

# Memory thresholds (percent, 0..100)
MEMORY_WARNING=75
MEMORY_CRITICAL=90

# Disk thresholds (percent, 0..100)
DISK_WARNING=80
DISK_CRITICAL=95

# Load average thresholds (absolute load values)
LOAD_WARNING=4.0
LOAD_CRITICAL=8.0

# Monitoring interval in seconds
MONITOR_INTERVAL=5

# Number of top processes to display per category
TOP_PROCESSES=5

# Mount point to monitor for disk usage
MONITOR_DISK=/

# Logging
LOG_LEVEL=INFO
LOG_FILE=logs/monitor.log

# Feature toggles (true/false)
NETWORK_MONITOR=true
ENABLE_DESKTOP_NOTIFICATION=false

# Alert cooldown in seconds (prevents alert flooding)
ALERT_COOLDOWN=300
